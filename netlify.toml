# Configuration del entorno de construcción
[build]
  publish = "."

# Encabezados HTTP de seguridad y caché globales
[[headers]]
  for = "/*"
  [headers.values]
    # Forzar la conexión HTTPS mediante HSTS
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Seguridad general contra Clickjacking y Sniffing
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Caché agresiva para recursos estáticos pesados (Imágenes AVIF, WebP, SVG)
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Caché equilibrada para estilos CSS
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# Caché equilibrada para scripts JavaScript
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"